<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEMUH'S SANDBOX — personal archive</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#171714;--paper:#e9e3d3;--ink:#1b211b;--lime:#d9f35a;--orange:#f28d59;--line:#48483e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:'Space Grotesk',Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}header{border-bottom:1px solid var(--line);padding:24px max(20px,calc((100vw - 1150px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:clamp(22px,4vw,35px);font-weight:700;letter-spacing:-.075em}.brand span{color:var(--lime)}.micro,.eyebrow,.tag,.nav button,.meta{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase}.micro{color:#a5a599}.nav{max-width:1150px;margin:0 auto;padding:17px 20px;display:flex;gap:9px;flex-wrap:wrap}.nav button,.ghost{border:1px solid var(--line);color:var(--paper);background:transparent;padding:11px 15px}.nav button.active,.nav button:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}main{max-width:1150px;margin:auto;padding:20px 20px 100px}.hero{border:1px solid var(--line);padding:clamp(25px,5vw,65px);min-height:330px;position:relative;overflow:hidden;background:radial-gradient(circle at 90% 10%,#4a482c 0,transparent 37%),#22231e}.hero h1{font-size:clamp(55px,10vw,120px);line-height:.87;letter-spacing:-.095em;margin:22px 0}.hero h1 em{font-style:normal;color:var(--lime)}.hero p{max-width:570px;font-size:17px;color:#c4c3b8}.sticker{position:absolute;right:5%;top:22%;background:var(--orange);color:var(--ink);padding:18px 13px;transform:rotate(13deg);font-family:'DM Mono',monospace;font-weight:bold;border-radius:50%;font-size:13px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:42px 0 18px;border-bottom:1px solid var(--line);padding-bottom:14px}.section-head h2{font-size:clamp(28px,5vw,50px);letter-spacing:-.06em;margin:0}.section-head small{color:#a9a99d}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{border:1px solid var(--line);background:#22231e;overflow:hidden}.tile .cover{aspect-ratio:4/3;background:#34372c;display:grid;place-items:center;position:relative;overflow:hidden}.tile .cover img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:55px;color:var(--lime)}.tile-body{padding:18px}.tile h3{font-size:24px;letter-spacing:-.04em;margin:10px 0 8px}.tile p{color:#c1c0b3;line-height:1.55;white-space:pre-wrap}.tag{color:var(--lime)}.meta{color:#a3a397}.tile a{display:inline-block;margin-top:8px;text-decoration:none;border-bottom:1px solid var(--lime);padding-bottom:3px}.feature{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:var(--paper);color:var(--ink);padding:30px;margin:25px 0}.feature h2{font-size:clamp(30px,5vw,62px);letter-spacing:-.07em;line-height:1}.feature p{line-height:1.65}.feature .stamp{font-size:100px;display:grid;place-items:center;background:#d6d0be}.empty{border:1px dashed var(--line);padding:30px;color:#aaa99d}.admin{background:#292b24;border:1px solid var(--lime);padding:22px;margin-top:30px}.admin h2{margin:0 0 12px}.admin label{display:block;font-family:'DM Mono',monospace;font-size:12px;margin-top:13px}.admin input,.admin select,.admin textarea{width:100%;background:#171714;border:1px solid #626457;color:white;padding:12px;margin-top:7px;border-radius:0}.admin textarea{min-height:110px}.admin .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.action{background:var(--lime);color:var(--ink);border:0;padding:12px 18px;font-weight:700;margin:12px 8px 0 0}.danger{background:#f29b8a}.itemrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line)}.itemrow button{background:transparent;border:1px solid #77786b;color:white;padding:7px}.hidden{display:none!important}.note{color:#c3c2b5;font-size:13px;line-height:1.6}.footer{border-top:1px solid var(--line);padding:25px 20px;text-align:center;color:#aaa99d;font-family:'DM Mono',monospace;font-size:11px}.rank{position:absolute;left:12px;top:12px;background:var(--lime);color:#171714;padding:8px 11px;font-weight:bold}.toast{position:fixed;bottom:15px;right:15px;background:var(--lime);color:var(--ink);padding:13px;z-index:10}@media(max-width:760px){header{padding:18px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.feature{grid-template-columns:1fr}.sticker{right:8%;top:12%;font-size:10px;padding:10px}.hero h1{margin-top:80px}.admin .two{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.tile .cover{aspect-ratio:16/9}.hero{min-height:310px}.brand{font-size:25px}}
 .login-panel{max-width:480px;margin:30px auto;padding:24px;border:1px solid var(--lime);background:#292b24}.login-panel input{width:100%;padding:12px;margin:8px 0 14px;background:#171714;color:white;border:1px solid #777}.login-panel label{display:block;font-size:13px}.statusline{font-family:'DM Mono',monospace;font-size:12px;color:#bbb9aa;margin:10px 0}.admin button:disabled{opacity:.55;cursor:wait}</style></head><body><header><div><div class="brand">DEMUH<span>✳</span> SANDBOX</div><div class="micro">A PERSONAL INTERNET CORNER / EST. 2026</div></div><button class="ghost micro" id="adminToggle">✳ EDIT MODE</button></header><nav class="nav" id="nav"></nav><main id="main"></main><footer class="footer">MADE WITH CURIOSITY · NO ALGORITHM, JUST TASTE · © DEMUH</footer><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL='https://fqjkbnjkqrydzbgdvijc.supabase.co';
const SUPABASE_KEY='sb_publishable_Ab4Hf5YC6juSTG_JpF0z1Q_sFLEpVHU';
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const sections=['Aktuelles','Musik','Filme','Bücher','Vlogs','Über mich'];
let items=[],page='Aktuelles',editing=null,admin=false,loggedIn=false,authUser=null,loadError='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon={Musik:'♫',Filme:'▣',Bücher:'✳',Vlogs:'◉',Aktuelles:'✦','Über mich':'☺'};
function flash(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast')?.classList.add('hidden'),3000)}
function toEntry(row){return {id:row.id,category:row.category,title:row.title,kind:row.subtitle||'',body:row.description||'',image:row.image_url||'',link:row.external_url||'',rank:row.ranking,date:row.date_label||''}}
function fromEntry(x){return {category:x.category,title:x.title,subtitle:x.kind||null,description:x.body||null,image_url:x.image||null,external_url:x.link||null,ranking:x.rank||null,date_label:x.date||null,published:true}}
async function loadItems(){if(!db){loadError='Supabase-Bibliothek konnte nicht geladen werden.';render();return}const {data,error}=await db.from('entries').select('*').order('created_at',{ascending:true}).limit(1000);if(error){loadError=error.message;console.error(error)}else{items=(data||[]).map(toEntry);loadError=''}render()}
async function checkAdmin(){if(!db)return;const {data:{user},error}=await db.auth.getUser();authUser=error?null:user;loggedIn=false;if(authUser){const r=await db.from('admin_users').select('user_id').eq('user_id',authUser.id).maybeSingle();loggedIn=!r.error&&!!r.data}if(!loggedIn)admin=false;updateToggle();render()}
function updateToggle(){$('#adminToggle').textContent=loggedIn?(admin?'✕ CLOSE EDITOR':'✳ EDIT MODE'):'✳ ADMIN LOGIN'}
function card(x){return `<article class="tile"><div class="cover">${x.image?`<img src="${esc(x.image)}" alt="">`:`<span class="placeholder">${icon[x.category]||'✳'}</span>`}${x.rank?`<span class="rank">#${esc(x.rank)}</span>`:''}</div><div class="tile-body"><span class="tag">${esc(x.kind||x.category)}</span><h3>${esc(x.title)}</h3>${x.date?`<span class="meta">${esc(x.date)}</span>`:''}<p>${esc(x.body||'')}</p>${/^https?:\/\//i.test(x.link||'')?`<a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">OPEN LINK ↗</a>`:''}</div></article>`}
function listing(arr){return arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:'<div class="empty">Noch nichts veröffentlicht. Hier ist Platz für deine nächsten Entdeckungen.</div>'}
function render(){ $('#nav').innerHTML=sections.map(s=>`<button data-page="${s}" class="${page===s?'active':''}">${s}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});let h='';if(page==='Aktuelles'){h=`<section class="hero"><div class="eyebrow">ISSUE NO. 001 / THE PERSONAL ARCHIVE</div><h1>GOOD<br><em>STUFF.</em><br>ONLY.</h1><p>Musik, Filme, Bücher und alles dazwischen. Eine ziemlich subjektive Sammlung von Dingen, die hängen bleiben.</p><div class="sticker">100%<br>PERSONAL</div></section><div class="section-head"><h2>FRESHLY POSTED ↘</h2><small>THE LATEST</small></div>${listing(items.filter(x=>x.category==='Aktuelles'||x.category==='Vlogs').slice().reverse().slice(0,6))}<div class="section-head"><h2>ON REPEAT ↗</h2><small>THE CURRENT ROTATION</small></div>${listing(items.filter(x=>x.category==='Musik').sort((a,b)=>(a.rank||99)-(b.rank||99)).slice(0,3))}`}
else if(page==='Über mich'){h=`<div class="feature"><div><div class="eyebrow">ABOUT THIS LITTLE CORNER</div><h2>HELLO,<br>INTERNET.</h2><p>Willkommen in meiner Sandbox. Hier sammle ich meine aktuellen Lieblingskünstler, Filme, Bücher und alles, was mir sonst so einfällt.</p><p>Keine perfekte Bestenliste, sondern eine Momentaufnahme. Die Dinge ändern sich. Die Seite auch.</p></div><div class="stamp">☺</div></div><div class="section-head"><h2>NOTES & THOUGHTS</h2></div>${listing(items.filter(x=>x.category===page))}`}
else{const a=items.filter(x=>x.category===page).sort((a,b)=>(a.rank||999)-(b.rank||999));h=`<div class="section-head"><h2>${icon[page]} ${page.toUpperCase()}</h2><small>CURATED BY DEMUH</small></div>${listing(a)}`}
$('#main').innerHTML=(loadError?`<div class="empty">Datenbankfehler: ${esc(loadError)}</div>`:'')+h+(admin&&loggedIn?adminHTML():'')+(admin&&!loggedIn?loginHTML():'');if(admin&&loggedIn)wireAdmin();if(admin&&!loggedIn)wireLogin()}
function loginHTML(){return `<section class="login-panel"><h2>✳ ADMIN LOGIN</h2><p class="note">Nur für den Betreiber dieser Sandbox. Besucher können alle veröffentlichten Einträge ansehen.</p><form id="loginForm"><label>E-Mail<input name="email" type="email" required autocomplete="username"></label><label>Passwort<input name="password" type="password" required autocomplete="current-password"></label><button class="action" type="submit">ANMELDEN ↗</button><p class="statusline" id="loginStatus"></p></form></section>`}
function wireLogin(){$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;$('#loginStatus').textContent='Anmeldung läuft …';const {error}=await db.auth.signInWithPassword({email:f.elements.email.value.trim(),password:f.elements.password.value});if(error){$('#loginStatus').textContent='Anmeldung fehlgeschlagen: '+error.message;b.disabled=false;return}await checkAdmin();if(!loggedIn){await db.auth.signOut();$('#loginStatus').textContent='Dieser Account ist nicht als Admin freigeschaltet.';b.disabled=false;return}admin=true;updateToggle();await loadItems();flash('Als Admin angemeldet!')}}
function adminHTML(){return `<section class="admin"><h2>✳ EDITOR / BACKSTAGE</h2><p class="note">Verbunden mit Supabase. Änderungen werden online gespeichert und sind für alle Besucher sichtbar.</p><button class="ghost" id="logout">ABMELDEN</button><form id="editor"><h3>${editing?'Eintrag bearbeiten':'Neuen Eintrag veröffentlichen'}</h3><div class="two"><label>Bereich<select name="category">${sections.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Typ / Label<input name="kind" placeholder="TOP ARTIST, REVIEW, JOURNAL ..."></label></div><label>Titel<input name="title" required maxlength="150" placeholder="Titel oder Künstlername"></label><label>Text<textarea name="body" placeholder="Deine Gedanken dazu ..."></textarea></label><div class="two"><label>Bild-URL<input name="image" placeholder="https://..."></label><label>Oder Bild hochladen<input name="upload" type="file" accept="image/*"></label></div><div class="two"><label>Externer Link<input name="link" type="url" placeholder="https://..."></label><label>Rang (optional)<input name="rank" type="number" min="1" placeholder="1"></label></div><label>Datum / Notiz (optional)<input name="date" placeholder="NOV 2026"></label><button class="action" type="submit">${editing?'ÄNDERUNGEN SPEICHERN':'VERÖFFENTLICHEN ↗'}</button><button class="ghost" type="button" id="cancelEdit">ZURÜCKSETZEN</button><p class="statusline" id="editorStatus"></p></form><h3>ALLE EINTRÄGE (${items.length})</h3><div>${items.map(x=>`<div class="itemrow"><span>${esc(x.category)} / ${esc(x.title)}</span><span><button data-edit="${esc(x.id)}">Edit</button> <button data-delete="${esc(x.id)}">Löschen</button></span></div>`).join('')}</div><button class="ghost" id="export">DATEN EXPORTIEREN ↓</button></section>`}
function wireAdmin(){const f=$('#editor');if(editing){let x=items.find(i=>i.id===editing);if(x)Object.keys(x).forEach(k=>{if(f.elements[k]&&k!=='upload')f.elements[k].value=x[k]??''})}
f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('button[type="submit"]'),status=$('#editorStatus');btn.disabled=true;status.textContent='Wird gespeichert …';try{const d=Object.fromEntries(new FormData(f));delete d.upload;d.title=String(d.title).trim();if(!d.title)throw Error('Titel fehlt');d.rank=d.rank?Number(d.rank):null;const file=f.elements.upload.files[0];if(file){if(file.size>12*1024*1024)throw Error('Bild zu groß (max. 12 MB).');const imageData=await resize(file);const blob=await(await fetch(imageData)).blob();const path=`${authUser.id}/${crypto.randomUUID()}.jpg`;const {error:uploadError}=await db.storage.from('demuh-images').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(uploadError)throw uploadError;d.image=db.storage.from('demuh-images').getPublicUrl(path).data.publicUrl}const payload=fromEntry(d);let q=editing?db.from('entries').update(payload).eq('id',editing):db.from('entries').insert(payload);const {error}=await q;if(error)throw error;editing=null;await loadItems();flash('Online gespeichert!')}catch(err){status.textContent='Fehler: '+err.message;btn.disabled=false;console.error(err)}};
$('#cancelEdit').onclick=()=>{editing=null;render()};$('#logout').onclick=async()=>{await db.auth.signOut();loggedIn=false;authUser=null;admin=false;editing=null;updateToggle();await loadItems();flash('Abgemeldet')};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;render();$('#editor').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Diesen Eintrag wirklich dauerhaft online löschen?'))return;b.disabled=true;const {error}=await db.from('entries').delete().eq('id',b.dataset.delete);if(error){alert('Löschen fehlgeschlagen: '+error.message);b.disabled=false}else{await loadItems();flash('Gelöscht')}});
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='demuh-sandbox-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function resize(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1100/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.76))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
$('#adminToggle').onclick=()=>{admin=!admin;editing=null;updateToggle();render();if(admin)setTimeout(()=>document.querySelector('.admin,.login-panel')?.scrollIntoView({behavior:'smooth'}),40)};
(async()=>{if(db){await checkAdmin();await loadItems()}else{loadError='Supabase-Bibliothek konnte nicht geladen werden.';render()}})();
</script></body></html>
