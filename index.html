e(1,5).map(homeCard).join('')}</div>`:''}`:'<div class="empty">Noch keine Beiträge veröffentlicht. Der nächste Review bekommt hier seinen großen Auftritt.</div>'}<div class="section-head"><h2>CURRENTLY INTO ↘</h2><small>A LITTLE LIFE UPDATE</small></div><div class="now-grid">${nowPanel('NOW PLAYING','NOW PLAYING','♫','Musik')}${nowPanel('NOW READING','NOW READING','✳','Bücher')}</div><div class="random-strip"><div><span class="tag">✳ INTERNET ROULETTE</span><h3>FIND SOMETHING RANDOM.</h3><p>Ein zufälliger Fund aus meinem Archiv. Keine Empfehlung vom Algorithmus.</p></div><button id="randomFind">SURPRISE ME ↗</button></div><div class="home-bottom"><section><div class="section-head"><h2>ON REPEAT ↗</h2><small>TOP ARTISTS</small></div>${favoriteListing(music.slice(0,3))}<button class="home-text-link" data-go="Musik">ALLE MUSIK-FAVORITEN ↗</button></section><section><div class="section-head"><h2>EXPLORE THE ARCHIVE ✳</h2><small>TAKE A LOOK AROUND</small></div><div class="home-directory"><button data-go="Filme"><span>01</span><strong>FILME</strong><b>↗</b></button><button data-go="Bücher"><span>02</span><strong>BÜCHER</strong><b>↗</b></button><button data-go="Vlogs"><span>03</span><strong>VLOGS</strong><b>↗</b></button><button data-go="Minispiele"><span>04</span><strong>MINISPIELE</strong><b>↗</b></button><button data-go="The Wall"><span>05</span><strong>THE WALL</strong><b>↗</b></button></div></section></div>`}
else if(page==='Minispiele'){h=`<div class="section-head"><h2>♠ MINISPIELE</h2><small>THE PLAYGROUND</small></div><section class="game-shell"><div class="game-heading"><div><span class="game-label">GAME NO. 001 / DICE CLUB</span><h3>SCHOCKEN 🎲</h3></div><span class="game-label">3 WÜRFEL · 3 WÜRFE</span></div><p class="game-description">Erst den Becher schütteln, dann aufdecken. Halte nach dem Aufdecken einzelne Würfel fest und würfle die übrigen erneut. Maximal drei Würfe – ganz wie am Tisch.</p><div class="dice-tray" id="diceTray"></div><div class="six-rule" id="sixRule"></div><div class="game-actions"><button class="action" id="rollDice">▣ BECHER SCHÜTTELN</button><button class="ghost" id="finishDice" type="button">ERGEBNIS WERTEN</button><button class="ghost" id="resetDice">NEUE RUNDE ↻</button><span class="micro" id="rollCount">WURF 0 / 3</span></div><div class="dice-cup-label" id="cupLabel">DER BECHER IST BEREIT</div><div class="game-result waiting" id="diceResult" aria-live="polite">Schüttel den Becher, um deinen ersten Wurf zu starten.</div><p class="game-foot">HAUSREGELN: Nur 1–2–3 und 4–5–6 sind Straßen. Zwei Sechsen erlauben eine 6→1; drei Sechsen in einem einzigen Wurf erlauben zwei 6→1.</p></section>`}
else if(page==='The Wall'){h=`<div class="section-head"><h2>✎ THE WALL</h2><small>THOUGHTS / PHOTOS / WHATEVER</small></div><p class="game-description">Eine digitale Pinnwand für alles, was sonst nirgendwo reinpasst. Kleine Gedanken, Fundstücke und Momentaufnahmen.</p>${wallListing()}`}

else{const hasTabs=['Musik','Filme','Bücher'].includes(page);const isMusic=page==='Musik';const showingReviews=subtab==='reviews';const a=items.filter(x=>x.category===page&&(!hasTabs||(showingReviews?x.entryType==='reviews':x.entryType==='favorites'&&(!isMusic||x.favoriteGroup===subtab)))).sort((a,b)=>hasTabs&&showingReviews?String(b.date||'').localeCompare(String(a.date||'')):(a.rank||999)-(b.rank||999));h=`<div class="section-head"><h2>${icon[page]} ${page.toUpperCase()}</h2><small>CURATED BY DEMUH</small></div>${hasTabs?`<div class="subnav">${isMusic?musicGroups.map(g=>`<button data-tab="${g}" class="${subtab===g?'active':''}">★ ${g.toUpperCase()}</button>`).join(''):`<button data-tab="favorites" class="${subtab==='favorites'?'active':''}">★ FAVORITES</button>`}<button data-tab="reviews" class="${subtab==='reviews'?'active':''}">✎ REVIEWS / ARTIKEL</button></div>`:''}${hasTabs?(showingReviews?reviewListing(a):favoriteListing(a)):(page==='Vlogs'?reviewListing(a):listing(a))}`}
$('#main').innerHTML=(loadError?`<div class="empty">Datenbankfehler: ${esc(loadError)}</div>`:'')+h+(admin&&loggedIn?adminHTML():'')+(admin&&!loggedIn?loginHTML():'');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{subtab=b.dataset.tab;render()});document.querySelectorAll('[data-go],[data-open-category]').forEach(b=>b.onclick=()=>{page=b.dataset.go||b.dataset.openCategory;subtab=page==='Musik'?'reviews':(['Filme','Bücher'].includes(page)?'reviews':'favorites');render();window.scrollTo(0,0)});if(page==='Minispiele')wireDice();document.querySelector('#randomFind')?.addEventListener('click',randomDiscovery);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const x=items.find(i=>String(i.id)===b.dataset.jump);if(!x)return;page=x.category;subtab='reviews';render();setTimeout(()=>[...document.querySelectorAll('[data-entry-id]')].find(e=>e.dataset.entryId===String(x.id))?.scrollIntoView({behavior:'smooth',block:'center'}),50)});if(admin&&loggedIn)wireAdmin();if(admin&&!loggedIn)wireLogin()}
function dicePips(value){const positions={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};return Array.from({length:9},(_,i)=>positions[value].includes(i)?'<span class="pip"></span>':'<span></span>').join('')}
function diceOutcome(){
 const a=[...diceValues].sort((x,y)=>x-y), desc=[...a].reverse().join(' – ');
 if(a.join('')==='111')return {name:'SCHOCK AUS!',desc:'1 – 1 – 1',detail:'Der höchste Schock. Besser geht es nicht.',type:'schock'};
 if(a[0]===1&&a[1]===1)return {name:`SCHOCK ${a[2]}`,desc:`1 – 1 – ${a[2]}`,detail:'Zwei Einsen und ein weiterer Würfel.',type:'schock'};
 if(a[0]===a[2])return {name:`GENERAL ${a[0]}`,desc:`${a[0]} – ${a[1]} – ${a[2]}`,detail:'Drei gleiche Zahlen.',type:'general'};
 if(['123','456'].includes(a.join('')))return {name:'STRASSE',desc:a.join(' – '),detail:'Eine der beiden Straßen: 1–2–3 oder 4–5–6.',type:'strasse'};
 return {name:'ZAHLENWURF',desc,detail:'Kein Schock, General oder Straße – dein Zahlenwurf zählt.',type:'zahl'};
}
function diceSixAllowance(){
 const sixes=diceValues.filter(v=>v===6).length;
 // Drei Sechsen müssen im selben Wurf gefallen sein, nicht über mehrere Würfe gesammelt.
 return sixes===3&&diceLastFreshSixes===3?2:sixes>=2?1:0;
}
function updateDice(){
 const tray=document.querySelector('#diceTray');if(!tray)return;
 const result=document.querySelector('#diceResult'),sixRule=document.querySelector('#sixRule');
 tray.style.display=diceFinished?'none':'';sixRule.style.display=diceFinished?'none':'';
 result.classList.toggle('in-tray',diceFinished);
 tray.innerHTML=diceValues.map((v,i)=>{
  const covered=diceCovered&&!diceHeld[i],hidden=diceRolls===0||covered;
  return `<button type="button" class="die-button ${diceHeld[i]?'held':''} ${hidden?'covered':''}" data-die="${i}" aria-pressed="${diceHeld[i]}" aria-label="Würfel ${i+1}: ${hidden?'verdeckt':v}${diceHeld[i]?', festgehalten':''}" ${hidden||diceFinished?'disabled':''}><span class="die-face">${hidden?'':dicePips(v)}</span><span class="hold-label">${hidden?(diceRolls===0?'UNTER DEM BECHER':'VERDECKT'):diceHeld[i]?'● FESTGEHALTEN':'○ ANTIPPEN ZUM HALTEN'}</span></button>`
 }).join('');
 tray.querySelectorAll('[data-die]').forEach(b=>b.onclick=()=>{if(diceCovered||diceFinished||diceRolls===0)return;const i=Number(b.dataset.die);diceHeld[i]=!diceHeld[i];updateDice()});
 document.querySelector('#rollCount').textContent=`WURF ${diceRolls} / 3`;
 const roll=document.querySelector('#rollDice'),finish=document.querySelector('#finishDice'),label=document.querySelector('#cupLabel');
 const available=Math.max(0,diceSixTurnLimit-diceSixTurns);
 sixRule.innerHTML=!diceCovered&&!diceFinished&&diceRolls>0&&available&&diceValues.includes(6)?`<button type="button" id="turnSix" class="ghost">↻ SECHS ZU EINS DREHEN (${available}×)</button><span class="micro">HAUSREGEL: ${diceSixTurnLimit===2?'3 SECHSEN IN EINEM WURF':'2 SECHSEN'}</span>`:'';
 const turnBtn=document.querySelector('#turnSix');if(turnBtn)turnBtn.onclick=()=>{const i=diceValues.indexOf(6);if(i<0)return;diceValues[i]=1;diceSixTurns++;diceHeld[i]=true;updateDice()};
 roll.disabled=diceFinished||(!diceCovered&&(diceRolls>=3||diceHeld.every(Boolean)));
 roll.textContent=diceFinished?'RUNDE BEENDET':diceCovered?'◉ BECHER AUFDECKEN':diceRolls===0?'▣ BECHER SCHÜTTELN':'▣ ERNEUT SCHÜTTELN';
 finish.disabled=diceFinished||diceCovered||diceRolls===0;
 label.textContent=diceFinished?'✳ DEIN ENDWURF':diceCovered?'▣ BECHER STEHT — JETZT AUFDECKEN':diceRolls===0?'▣ DER BECHER IST BEREIT':'◉ WÜRFEL ANTIPPPEN ZUM FESTHALTEN';
 result.className='game-result'+(diceFinished?' final':' waiting');
 if(diceFinished){const o=diceOutcome();result.innerHTML=`<div class="final-eyebrow">✳ DEIN ERGEBNIS / ${diceRolls} ${diceRolls===1?'WURF':'WÜRFE'}</div><div class="final-name">${o.name}</div><div class="final-dice">${o.desc}</div><div class="final-description">${o.detail}</div>`}
 else if(diceCovered)result.textContent='Die Würfel liegen verdeckt. Heb den Becher, um deinen Wurf zu sehen.';
 else if(diceRolls===0)result.textContent='Schüttel den Becher, um deinen ersten Wurf zu starten.';
 else if(diceRolls===3)result.textContent='Dritter Wurf aufgedeckt. Werte jetzt dein Ergebnis.';
 else result.textContent='Würfel aufgedeckt! Tippe Würfel an, die du behalten möchtest, oder schüttel erneut.';
}
function wireDice(){
 document.querySelector('#rollDice').onclick=()=>{
  if(diceFinished)return;
  if(diceCovered){diceCovered=false;diceSixTurns=0;diceSixTurnLimit=diceSixAllowance();updateDice();return}
  if(diceRolls>=3||diceHeld.every(Boolean))return;
  const fresh=diceValues.map((v,i)=>diceHeld[i]?null:crypto.getRandomValues(new Uint32Array(1))[0]%6+1);
  diceLastFreshSixes=fresh.filter(v=>v===6).length;
  diceValues=fresh.map((v,i)=>v===null?diceValues[i]:v);
  diceRolls++;diceCovered=true;updateDice();
 };
 document.querySelector('#finishDice').onclick=()=>{if(diceRolls===0||diceCovered||diceFinished)return;diceFinished=true;updateDice()};
 document.querySelector('#resetDice').onclick=()=>{diceValues=[1,1,1];diceHeld=[false,false,false];diceRolls=0;diceCovered=false;diceFinished=false;diceSixTurns=0;diceSixTurnLimit=0;diceLastFreshSixes=0;updateDice()};
 updateDice();
}

function wireLogin(){$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;$('#loginStatus').textContent='Anmeldung läuft …';const {error}=await db.auth.signInWithPassword({email:f.elements.email.value.trim(),password:f.elements.password.value});if(error){$('#loginStatus').textContent='Anmeldung fehlgeschlagen: '+error.message;b.disabled=false;return}await checkAdmin();if(!loggedIn){await db.auth.signOut();$('#loginStatus').textContent='Dieser Account ist nicht als Admin freigeschaltet.';b.disabled=false;return}admin=true;updateToggle();await loadItems();flash('Als Admin angemeldet!')}}
function adminHTML(){const managed=editing&&items.find(x=>x.id===editing)?.entryType==='favorites'?items.find(x=>x.id===editing).category:(['Musik','Filme','Bücher'].includes(page)?page:'Musik');const favorites=items.filter(x=>x.category===managed&&x.entryType==='favorites'&&(managed!=='Musik'||x.favoriteGroup===favoriteGroup)).sort((a,b)=>(a.rank||999)-(b.rank||999));const isFav=editorMode==='favorites';const categoryOptions=(isFav?['Musik','Filme','Bücher']:['Aktuelles','Musik','Filme','Bücher','Vlogs','Über mich']).map(x=>`<option ${x===(editing?items.find(y=>y.id===editing)?.category:managed)?'selected':''}>${x}</option>`).join('');return `<section class="admin"><h2>✳ EDITOR / BACKSTAGE</h2><p class="note">Favorites sind reine Ranglisten. Reviews und Artikel haben ihren eigenen Editor.</p><button class="ghost" id="logout">ABMELDEN</button><div class="editor-choice"><label><input type="radio" name="editorMode" value="favorites" ${isFav?'checked':''}>★ FAVORITES</label><label><input type="radio" name="editorMode" value="reviews" ${!isFav?'checked':''}>✎ REVIEWS & ARTIKEL</label></div><form id="editor"><h3>${editing?'Eintrag bearbeiten':isFav?'FAVORIT HINZUFÜGEN':'REVIEW / ARTIKEL SCHREIBEN'}</h3><label>Bereich<select name="category">${categoryOptions}</select></label>${isFav&&managed==='Musik'?`<label>Musik-Liste<select name="favoriteGroup" id="favoriteGroup">${musicGroups.map(g=>`<option value="${g}" ${g===favoriteGroup?'selected':''}>${g}</option>`).join('')}</select></label>`:''}<label>${isFav?'Titel (Künstler, Album, Film oder Buch)':'Titel des Artikels'}<input name="title" required maxlength="150" placeholder="${isFav?'Titel':'Überschrift'}"></label>${isFav?`<label>Autor / Künstler / Regisseur<input name="kind" maxlength="150" placeholder="z. B. Paul Auster oder Sofia Coppola"></label><div class="two"><label>Quadratisches Bild (optional) – URL<input name="image" placeholder="https://..."></label><label>Oder Bild hochladen<input name="upload" type="file" accept="image/*"></label></div>`:`<label>Untertitel / Typ<input name="kind" list="specialKinds" placeholder="REVIEW, NOW PLAYING, NOW READING, WALL NOTE ..."><datalist id="specialKinds"><option value="NOW PLAYING"><option value="NOW READING"><option value="WALL NOTE"></datalist></label><p class="note">NOW PLAYING: Bereich Musik · NOW READING: Bereich Bücher · WALL NOTE: Bereich Aktuelles. Der neueste Eintrag erscheint jeweils auf der Startseite bzw. Pinnwand.</p><label>Dein Text<textarea name="body" placeholder="Deine Gedanken dazu ..."></textarea></label><div class="two"><label>Bild-URL<input name="image" placeholder="https://..."></label><label>Oder Bild hochladen<input name="upload" type="file" accept="image/*"></label></div><label>Externer Link<input name="link" type="url" placeholder="https://..."></label><label>Datum / Notiz (optional)<input name="date" placeholder="NOV 2026"></label>`}<button class="action" type="submit">${editing?'ÄNDERUNGEN SPEICHERN':isFav?'FAVORIT HINZUFÜGEN':'ARTIKEL VERÖFFENTLICHEN ↗'}</button><button class="ghost" type="button" id="cancelEdit">ZURÜCKSETZEN</button><p class="statusline" id="editorStatus"></p></form>${isFav?`<h3>★ REIHENFOLGE — ${managed.toUpperCase()}${managed==='Musik'?' / '+favoriteGroup.toUpperCase():''}</h3><p class="note">Mit ↑ und ↓ verschieben, mit EDIT direkt bearbeiten oder mit ✕ löschen. Danach die Reihenfolge speichern.</p><div class="reorder-list" id="reorderList">${favorites.map((x,i)=>`<div class="reorder-item" data-id="${esc(x.id)}"><span>#${i+1}</span><strong>${esc(x.title)}${x.kind?' — '+esc(x.kind):''}</strong><button type="button" data-edit="${esc(x.id)}" title="Favorit bearbeiten">EDIT</button><button type="button" data-delete="${esc(x.id)}" title="Favorit löschen">✕</button><button type="button" data-move="up" data-id="${esc(x.id)}">↑</button><button type="button" data-move="down" data-id="${esc(x.id)}">↓</button></div>`).join('')||'<p class="note">Noch keine Favoriten vorhanden.</p>'}</div><button class="action" id="saveOrder" type="button">REIHENFOLGE SPEICHERN</button>`:''}<h3>REVIEWS & ARTIKEL (${items.filter(x=>x.entryType!=='favorites').length})</h3><p class="note">Favorites bearbeitest du direkt in der Reihenfolge oben. Hier stehen nur eigenständige Beiträge.</p><div>${items.filter(x=>x.entryType!=='favorites').map(x=>`<div class="itemrow"><span>${esc(x.category)} / ${x.entryType==='reviews'?'REVIEW':'FAVORIT'} / ${esc(x.title)}</span><span><button data-edit="${esc(x.id)}">Edit</button> <button data-delete="${esc(x.id)}">Löschen</button></span></div>`).join('')}</div><button class="ghost" id="export">DATEN EXPORTIEREN ↓</button></section>`}
function wireAdmin(){const f=$('#editor');document.querySelectorAll('input[name="editorMode"]').forEach(r=>r.onchange=()=>{editorMode=r.value;editing=null;render()});const groupSelect=$('#favoriteGroup');if(groupSelect)groupSelect.onchange=()=>{favoriteGroup=groupSelect.value;editing=null;render()};const list=$('#reorderList');if(list){list.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const el=b.closest('.reorder-item'),other=b.dataset.move==='up'?el.previousElementSibling:el.nextElementSibling;if(!other||!other.classList.contains('reorder-item'))return;if(b.dataset.move==='up')list.insertBefore(el,other);else list.insertBefore(other,el);list.querySelectorAll('.reorder-item').forEach((r,i)=>r.querySelector('span').textContent='#'+(i+1))});$('#saveOrder').onclick=async()=>{const btn=$('#saveOrder');btn.disabled=true;try{const ids=[...list.querySelectorAll('.reorder-item')].map(el=>el.dataset.id);for(let i=0;i<ids.length;i++){const {error}=await db.from('entries').update({ranking:i+1}).eq('id',ids[i]);if(error)throw error}await loadItems();flash('Reihenfolge online gespeichert!')}catch(e){alert('Speichern fehlgeschlagen: '+e.message)}finally{btn.disabled=false}}} if(editing){let x=items.find(i=>i.id===editing);if(x){editorMode=x.entryType;if(f.elements.category)f.elements.category.value=x.category;if(x.category==='Musik'&&x.entryType==='favorites'){favoriteGroup=x.favoriteGroup; if(f.elements.favoriteGroup)f.elements.favoriteGroup.value=favoriteGroup}document.querySelectorAll('input[name="editorMode"]').forEach(r=>r.checked=r.value===editorMode);Object.keys(x).forEach(k=>{if(f.elements[k]&&k!=='upload')f.elements[k].value=x[k]??''})}}
f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('button[type="submit"]'),status=$('#editorStatus');btn.disabled=true;status.textContent='Wird gespeichert …';try{const d=Object.fromEntries(new FormData(f));delete d.upload;d.title=String(d.title).trim();if(!d.title)throw Error('Titel fehlt');d.favoriteGroup=d.category==='Musik'?(d.favoriteGroup||favoriteGroup):'Künstler';d.rank=editorMode==='favorites'?(editing?(items.find(x=>x.id===editing)?.rank||null):(items.filter(x=>x.category===d.category&&x.entryType==='favorites'&&(d.category!=='Musik'||x.favoriteGroup===d.favoriteGroup)).reduce((m,x)=>Math.max(m,x.rank||0),0)+1)):null;d.entryType=editorMode;if(editorMode==='favorites'){d.body='';d.link='';d.date=''}const file=f.elements.upload?.files?.[0];if(file){if(file.size>12*1024*1024)throw Error('Bild zu groß (max. 12 MB).');const imageData=await resize(file);const blob=await(await fetch(imageData)).blob();const path=`${authUser.id}/${crypto.randomUUID()}.jpg`;const {error:uploadError}=await db.storage.from('demuh-images').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(uploadError)throw uploadError;d.image=db.storage.from('demuh-images').getPublicUrl(path).data.publicUrl}const payload=fromEntry(d);let q=editing?db.from('entries').update(payload).eq('id',editing):db.from('entries').insert(payload);const {error}=await q;if(error)throw error;editing=null;await loadItems();flash('Online gespeichert!')}catch(err){status.textContent='Fehler: '+err.message;btn.disabled=false;console.error(err)}};
$('#cancelEdit').onclick=()=>{editing=null;render()};$('#logout').onclick=async()=>{await db.auth.signOut();loggedIn=false;authUser=null;admin=false;editing=null;updateToggle();await loadItems();flash('Abgemeldet')};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;editorMode=items.find(x=>x.id===editing)?.entryType||'favorites';favoriteGroup=items.find(x=>x.id===editing)?.favoriteGroup||'Künstler';render();$('#editor').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Diesen Eintrag wirklich dauerhaft online löschen?'))return;b.disabled=true;const {error}=await db.from('entries').delete().eq('id',b.dataset.delete);if(error){alert('Löschen fehlgeschlagen: '+error.message);b.disabled=false}else{await loadItems();flash('Gelöscht')}});
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='demuh-sandbox-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function resize(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1100/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.76))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
$('#adminToggle').onclick=()=>{admin=!admin;editing=null;updateToggle();render();if(admin)setTimeout(()=>document.querySelector('.admin,.login-panel')?.scrollIntoView({behavior:'smooth'}),40)};
(async()=>{if(db){await checkAdmin();await loadItems()}else{loadError='Supabase-Bibliothek konnte nicht geladen werden.';render()}})();
</script></body></html>
